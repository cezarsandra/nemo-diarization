sample_rate: 16000
batch_size: 64
num_workers: 1
verbose: True
device: null  # null = auto-detect (cuda if available, else cpu)

diarizer:
  manifest_filepath: null  # set at runtime
  out_dir: ./output
  oracle_vad: False          # use VAD model, not ground-truth VAD
  collar: 0.25               # collar size (sec) for scoring
  ignore_overlap: True       # ignore overlapping speech in scoring

  vad:
    model_path: vad_multilingual_marblenet
    external_vad_manifest: null  # path to pre-computed VAD manifest, or null
    parameters:
      window_length_in_sec: 0.15
      shift_length_in_sec: 0.01
      smoothing: "median"
      overlap: 0.875
      onset: 0.1
      offset: 0.1
      pad_onset: 0.1
      pad_offset: 0.0
      min_duration_on: 0.0
      min_duration_off: 0.0
      filter_speech_first: True

  speaker_embeddings:
    model_path: titanet_large
    parameters:
      window_length_in_sec: [1.5, 1.25, 1.0, 0.75, 0.5]
      shift_length_in_sec: [0.75, 0.625, 0.5, 0.375, 0.25]
      multiscale_weights: [1, 1, 1, 1, 1]
      save_embeddings: True  # required by MSDD: pass1 saves pickles, pass2 loads them

  clustering:
    parameters:
      oracle_num_speakers: False
      max_num_speakers: 8
      enhanced_count_thres: 80
      max_rp_threshold: 0.25
      sparse_search_volume: 10
      maj_vote_spk_count: False

  msdd_model:
    model_path: diar_msdd_telephonic
    parameters:
      use_teacher_forcing: True
      sigmoid_threshold: [0.7]
      session_len_sec: 90
      diar_window_length: 50
      overlap_add_spk_num: 6
      infer_overlap: True
      infer_batch_size: 25
      seq_eval_mode: False
      split_infer: False
      use_adaptive_thres: True
      max_overlap_spks: 2
      num_workers: 1
